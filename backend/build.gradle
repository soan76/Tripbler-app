plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.tripbler'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-restclient'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	
	implementation 'com.google.api-client:google-api-client:2.9.0'

	// 번역 화면 찍기 모드의 줄별 번역·한글 발음(Claude API). 키는 서버 환경 변수 ANTHROPIC_API_KEY.
	implementation 'com.anthropic:anthropic-java:3.3.0'

	runtimeOnly 'org.postgresql:postgresql'

	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	// 실제 외부 API를 부르는 측정 테스트(@Tag("live"))는 일반 test에서 뺀다. 아래 liveTest로만 실행한다.
	useJUnitPlatform {
		excludeTags 'live'
	}
}

// 실제 Claude 사진 번역 측정(유료 호출, 사진 전송). 환경 변수 게이트(ANTHROPIC_LIVE_TEST=true 등)도 함께 필요하다.
// 실행 방법과 결과 폴더 규칙: docs/translation-photo-measurements.md
tasks.register('liveTest', Test) {
	description = 'Runs live tests that call real external APIs (@Tag("live")).'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'live'
	}
	systemProperty 'photoLive.buildDir', layout.buildDirectory.get().asFile.absolutePath
	outputs.upToDateWhen { false }
}
