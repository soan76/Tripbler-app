spring.application.name=tripbler-backend

server.port=8080
server.address=0.0.0.0

spring.datasource.url=jdbc:postgresql://localhost:5432/tripbler
spring.datasource.username=postgres
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

security.jwt.secret=${JWT_SECRET}
security.jwt.access-token-expiration-seconds=3600
security.refresh-token.expiration-days=14

coingecko.api-key=${COINGECKO_API_KEY}

# Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_APP_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.default-encoding=UTF-8

profile-image.storage.local-root=${PROFILE_IMAGE_LOCAL_ROOT:./uploads}
profile-image.storage.public-base-url=${PROFILE_IMAGE_PUBLIC_BASE_URL:http://localhost:8080/uploads}
profile-image.storage.type=${PROFILE_IMAGE_STORAGE_TYPE:local}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# 요청 한도(6MB) 이상이면 업로드 파트를 임시 파일로 쓰지 않고 메모리에만 둔다(사진 번역 비저장, docs/translation-photo-api.md).
# 임시값: 실제 Claude 측정(작업 14) 뒤 확정
spring.servlet.multipart.file-size-threshold=6MB
# Compress sufficiently large JSON history responses for clients accepting gzip.
server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=1024

# 번역 찍기 모드 줄별 번역·한글 발음(Claude API). 키는 환경 변수 ANTHROPIC_API_KEY로만 넣는다(이 파일에 적지 않음).
# 키가 없거나 Claude 호출이 실패하면 /api/v1/translation/lines는 Google 번역으로 대체한다(발음 없음).
anthropic.api-key=${ANTHROPIC_API_KEY:}
translation.lines.model=claude-opus-5-5
# 거절(refusal) 때 서버가 다른 모델로 다시 시도하는 fallbacks(베타 server-side-fallback-2026-07-01).
# 구조화 출력과 함께 보냈을 때의 동작을 실제 키로 확인하기 전까지 끈다.
translation.lines.fallbacks-enabled=false

# 사진 번역 동시 처리 상한. 요청마다 사진 사본이 AI 호출 동안 메모리에 머물므로 자리가 없으면 기다리지 않고 429로 거절한다.
# 임시값: 실제 Claude 측정(작업 14) 뒤 확정
translation.photo.max-concurrent=4
